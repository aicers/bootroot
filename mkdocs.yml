INHERIT: docs/theme/mkdocs-base.yml
site_name: Bootroot Manual
site_description: Bootroot user manual (EN/KR)
repo_url: https://github.com/aicers/bootroot
site_url: https://example.invalid/bootroot
copyright: Copyright 2026 ClumL Inc.

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          build: true
          default: true
          nav:
            - Overview: index.md
            - Concepts: concepts.md
            - CLI: cli.md
            - CLI Examples: cli-examples.md
            - Installation: installation.md
            - Remote Bootstrap: remote-bootstrap.md
            - Configuration: configuration.md
            - Operations: operations.md
            - CI & E2E: e2e-ci.md
            - Troubleshooting: troubleshooting.md
        - locale: ko
          name: 한국어
          build: true
          nav:
            - Overview: index.md
            - Concepts: concepts.md
            - CLI: cli.md
            - CLI Examples: cli-examples.md
            - Installation: installation.md
            - Remote Bootstrap: remote-bootstrap.md
            - Configuration: configuration.md
            - Operations: operations.md
            - CI & E2E: e2e-ci.md
            - Troubleshooting: troubleshooting.md
          nav_translations:
            Overview: 개요
            Concepts: 개념
            CLI: CLI
            CLI Examples: CLI 예제
            Installation: 설치
            Remote Bootstrap: 원격 부트스트랩
            Configuration: 설정
            Operations: 운영
            CI & E2E: CI/E2E
            Troubleshooting: 문제 해결

extra:
  pdf:
    cover_title: Bootroot
    cover_subtitle:
      en: User Manual
      ko: 사용자 매뉴얼
    cover_tagline:
      en: Technical Installation and Operations Manual
      ko: 기술 설치 및 운영 매뉴얼
    toc_title:
      en: Table of Contents
      ko: 목차
    output_basename: bootroot-manual
