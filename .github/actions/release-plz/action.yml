name: Run bootroot's pinned release-plz
description: Build and run the same release-plz source for PRs and releases
inputs:
  command:
    description: release or release-pr
    required: true
  config:
    description: Optional release-plz configuration override
    required: false
  manifest-path:
    description: Optional manifest path for a release from an earlier merge
    required: false
outputs:
  pr:
    description: JSON for the first PR that was opened or updated
    value: ${{ steps.release-plz.outputs.pr }}
  prs_created:
    description: Whether a release PR was opened or updated
    value: ${{ steps.release-plz.outputs.prs_created }}
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - name: Cache the patched release-plz binary
      id: cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/bootroot-release-plz/bin/release-plz
        key: release-plz-${{ runner.os }}-${{ runner.arch }}-92e907a14715182c99c26eb734a4b3d7b3775a0b-${{ hashFiles('.github/release-plz-0.4.3.patch') }}
    - name: Build release-plz
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        RELEASE_PLZ_SOURCE: 92e907a14715182c99c26eb734a4b3d7b3775a0b # release-plz-v0.4.3
      run: |
        set -euo pipefail
        source_dir="${RUNNER_TEMP}/release-plz-source"
        git init -q "$source_dir"
        git -C "$source_dir" fetch --depth 1 https://github.com/release-plz/release-plz.git "$RELEASE_PLZ_SOURCE"
        git -C "$source_dir" checkout --detach FETCH_HEAD
        git -C "$source_dir" apply "${GITHUB_WORKSPACE}/.github/release-plz-0.4.3.patch"
        cargo install --locked --debug --no-default-features --path "$source_dir/crates/release_plz" \
          --root "${RUNNER_TEMP}/bootroot-release-plz"
    - name: Select the patched release-plz binary
      shell: bash
      run: |
        set -euo pipefail
        bin="${RUNNER_TEMP}/bootroot-release-plz/bin"
        test -x "$bin/release-plz"
        test "$("$bin/release-plz" --version)" = 'release-plz 0.4.3'
        # Keep the pinned action's own installation separate so only the
        # patched release-plz is resolved through PATH. Its installer is
        # installed alongside the upstream binary and also needs to be visible.
        printf '%s\n' "${RUNNER_TEMP}/upstream-release-plz/bin" "$bin" >> "$GITHUB_PATH"
    - name: Run release-plz
      id: release-plz
      uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
      env:
        CARGO_INSTALL_ROOT: ${{ runner.temp }}/upstream-release-plz
      with:
        command: ${{ inputs.command }}
        config: ${{ inputs.config }}
        manifest_path: ${{ inputs.manifest-path }}
        version: 0.4.3
