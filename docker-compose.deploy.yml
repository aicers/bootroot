# Deploy-oriented compose for prebuilt / air-gapped installs.
#
# Unlike docker-compose.yml, this file carries NO `build:` contexts: every
# service references a prebuilt `image:` tag only, so `bootroot infra install`
# can bring the stack up from a binaries-plus-images payload without a source
# checkout. Pair it with `infra install --compose-file docker-compose.deploy.yml
# --image-archive-dir <dir> --no-build`: the tarballs are `docker load`ed and
# the tagged images are used as-is (no rebuild, no network).
#
# Every image reference is interpolated from an environment variable so an
# installer can name the images its archives restored; unset, each falls back
# to the release default. The registry pins behind the `openbao`, `postgres`
# and `step-ca` defaults live in deploy/runtime-images.json, not here: release
# preparation pulls each image by its declared digest, tags it with the
# default tag below and saves it, and an offline install runs exactly the tag
# the archive restores. Do not set an image variable to a `@sha256:` reference
# for an offline install: `docker save`/`docker load` does not guarantee the
# registry digest survives as a RepoDigest. scripts/validate-runtime-images.sh
# holds these defaults to the declaration. The monitoring services below sit
# behind the `lan`/`public` profiles, outside the declared production stack.
#
# The only source-tree config the default install services still need is
# `openbao/openbao.hcl` and `responder.toml.compose`; `infra install` itself
# generates `.env` and creates the `secrets/` and `certs/` directories.
services:
  openbao:
    image: ${OPENBAO_IMAGE:-openbao/openbao:2.5.5}
    container_name: ${BOOTROOT_INSTANCE:-bootroot}-openbao
    restart: always
    ports:
      - "127.0.0.1:${OPENBAO_HOST_PORT:-8200}:8200"
    expose:
      - "9101"
    volumes:
      - openbao-data:/openbao/file
      - openbao-audit:/openbao/audit
      - ./openbao:/openbao/config:ro
    # The standard entrypoint chowns /openbao/config and /openbao/file but
    # does not know about /openbao/audit.  Fix ownership before delegating
    # to the original entrypoint so the openbao user can write audit logs.
    entrypoint: ["sh", "-c", "chown openbao:openbao /openbao/audit && chmod 700 /openbao/audit && exec docker-entrypoint.sh server -config=/openbao/config/openbao.hcl"]

  # PostgreSQL for step-ca. The port is exposed to the host so that
  # `bootroot rotate db` (which runs on the host) can connect directly.
  # PostgreSQL 18 expects the parent directory mount so its default PGDATA
  # layout works correctly.
  # The published default is 5433 so bootroot does not claim the
  # conventional 5432 port; set POSTGRES_HOST_PORT to override.
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.4}
    container_name: ${BOOTROOT_INSTANCE:-bootroot}-postgres
    restart: always
    environment:
      - POSTGRES_USER=step
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=stepca
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  step-ca:
    image: ${BOOTROOT_STEP_CA_IMAGE:-smallstep/step-ca:0.30.2}
    container_name: ${BOOTROOT_INSTANCE:-bootroot}-ca
    restart: always
    # Run as the owner of ./secrets so the container can read the key
    # material and OpenBao-Agent-rendered files kept there. `infra install`
    # / `infra up` upsert BOOTROOT_STEPCA_USER into `.env`; when it is unset
    # (CI, the test overlay, deploy-compose validation) the container falls
    # back to the image's built-in non-root `step` user (uid/gid 1000).
    user: "${BOOTROOT_STEPCA_USER:-1000:1000}"
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:${STEPCA_HOST_PORT:-9000}:9000"
    expose:
      - "9102"
    # The official image ships a HEALTHCHECK that runs `step ca health`
    # with no `--ca-url`, which exits non-zero and would make
    # `bootroot infra up` report step-ca unhealthy. Disable it to preserve
    # today's status-only readiness behavior.
    healthcheck:
      disable: true
    volumes:
      - ./secrets:/home/step
    command:
      [
        "/usr/local/bin/step-ca",
        "/home/step/config/ca.json",
        "--password-file",
        "/home/step/password.txt",
      ]

  bootroot-http01:
    image: ${BOOTROOT_HTTP01_IMAGE:-bootroot-http01-responder:0.3.0}
    container_name: ${BOOTROOT_INSTANCE:-bootroot}-http01
    restart: always
    ports:
      - "127.0.0.1:${HTTP01_ADMIN_HOST_PORT:-8080}:8080"
    volumes:
      - ./responder.toml.compose:/app/responder.toml:ro
    command:
      - --config=/app/responder.toml
    networks:
      default:

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.1}
    container_name: ${BOOTROOT_INSTANCE:-bootroot}-prometheus
    restart: always
    profiles:
      - lan
      - public
    depends_on:
      - step-ca
      - openbao
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.0.3}
    container_name: ${BOOTROOT_INSTANCE:-bootroot}-grafana
    restart: always
    profiles:
      - lan
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_LAN_BIND_ADDR:-127.0.0.1}:3000:3000"

  grafana-public:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.0.3}
    container_name: ${BOOTROOT_INSTANCE:-bootroot}-grafana-public
    restart: always
    profiles:
      - public
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "0.0.0.0:3000:3000"

volumes:
  openbao-data:
  openbao-audit:
  postgres-data:
  prometheus-data:
  grafana-data:
