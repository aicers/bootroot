# Generated by `bootroot init`. This file is bootroot's own: it
# configures the `bootroot-agent` process that renews the
# bootroot-internal registrar credential and, on an
# endpoint-enabled host, serves the registrar endpoint.
#
#   bootroot-agent --config /var/lib/bootroot/secrets/registrar-internal/agent.toml
#
# `bootroot-registrar.service` runs that process; `bootroot init`
# does not start it. The `[registrar]` and `[registrar_endpoint]`
# tables are copied from the `--agent-config` file `bootroot init`
# ran with and carried over unchanged by every rotation.
email = "admin@example.com"
server = "https://localhost:9000/acme/acme/directory"
domain = "example.internal"

[acme]
directory_fetch_attempts = 10
directory_fetch_base_delay_secs = 1
directory_fetch_max_delay_secs = 10
poll_attempts = 15
poll_interval_secs = 2
http_responder_url = "http://127.0.0.1:8080"
http_responder_hmac = "hmac-value"
http_responder_timeout_secs = 5
http_responder_token_ttl_secs = 300
account_key_path = "/var/lib/bootroot/secrets/registrar-internal/acme-account.json"

[retry]
backoff_secs = [5, 15, 60]

[scheduler]
max_concurrent_issuances = 1

[trust]
ca_bundle_path = "/var/lib/bootroot/secrets/registrar-internal/ca-bundle.pem"
trusted_ca_sha256 = ["cf1c7c37a9c4ad9b8ea01332310a4013fa20bdf8d3fed57f20ca0607b9d0b72f"]

[eab]
kid = "kid-1"
hmac = "hmac-1"

[[profiles]]
registration_id = "bootroot-01-bootroot-registrar-internal"
service_name = "bootroot-registrar-internal"
instance_id = "001"
hostname = "bootroot-01"

[profiles.paths]
cert = "/var/lib/bootroot/secrets/registrar-internal/chain.pem"
key = "/var/lib/bootroot/secrets/registrar-internal/key.pem"

[registrar]
state_file = "/var/lib/bootroot/state.json"
agent_server = "https://bootroot-ca.example.internal:9000/acme/acme/directory"
agent_responder_url = "http://bootroot-http01.example.internal:8080"

[registrar_endpoint]
enabled = true
server_cert_path = "/etc/bootroot/registrar/server.crt"
server_key_path = "/etc/bootroot/registrar/server.key"
client_cert_path = "/etc/bootroot/registrar/client.crt"
client_key_path = "/etc/bootroot/registrar/client.key"
